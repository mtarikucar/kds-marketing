server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets (vite adds a content hash): safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # MCP OAuth discovery (RFC 9728 / RFC 8414) must be served from the DOMAIN
    # ROOT, but the edge proxy only forwards /api/* to the API container — so
    # without these two blocks the documents fall through to the SPA below and
    # answer HTML instead of JSON, silently breaking Claude.ai connector
    # discovery. Nest already excludes these paths from its global `api` prefix.
    #
    # `resolver` + variable upstream is deliberate: every deploy RECREATES the
    # backend container with a new IP, and a literal `proxy_pass http://backend:3000`
    # would be resolved once at startup — nginx would then keep proxying to the
    # dead IP until it happened to be reloaded. 127.0.0.11 is docker's embedded
    # DNS. `$request_uri` forwards the original path (and query) untouched.
    location ^~ /.well-known/oauth-authorization-server {
        resolver 127.0.0.11 valid=10s;
        set $mcp_oauth_upstream backend;
        proxy_pass http://$mcp_oauth_upstream:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /.well-known/oauth-protected-resource {
        resolver 127.0.0.11 valid=10s;
        set $mcp_oauth_upstream backend;
        proxy_pass http://$mcp_oauth_upstream:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA routing — force no-cache on the HTML entry point so every
    # navigation gets the latest bundle hashes (see the source repo's
    # nginx.conf for the staging incident this prevents).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
