; NetGSM Netsantral extension 102 ("jeetases"): UDP, registered from this host only. The secret
; lives in secrets/pjsip_auth.conf (0600, uid 1500), never in the repository.
[global]
type=global
user_agent=jeeta-voice
endpoint_identifier_order=ip,username

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5070

#include secrets/pjsip_auth.conf

; max_retries: Asterisk gives a registration up for good after this many timeouts or 5xx in a row
; (default 10, five minutes at retry_interval=30). A wrong secret still stops it at once
; (auth_rejection_permanent stays yes), so NetGSM is not hammered with bad credentials.
[netgsm-reg]
type=registration
transport=transport-udp
outbound_auth=netgsm-auth
server_uri=sip:sip5.netsantral.com
client_uri=sip:102-8508407303@sip5.netsantral.com
contact_user=102-8508407303
retry_interval=30
forbidden_retry_interval=300
max_retries=10000
expiration=120
line=yes
endpoint=netgsm

[netgsm]
type=aor
contact=sip:sip5.netsantral.com
qualify_frequency=20

[netgsm]
type=endpoint
transport=transport-udp
context=jeeta-in
disallow=all
allow=alaw,ulaw
outbound_auth=netgsm-auth
aors=netgsm
from_user=102-8508407303
from_domain=sip5.netsantral.com
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
trust_id_inbound=no
send_pai=no

[netgsm]
type=identify
endpoint=netgsm
match=sip5.netsantral.com
