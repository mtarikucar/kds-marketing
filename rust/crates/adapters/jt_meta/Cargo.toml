[package]
name = "jt_meta"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Meta adapter: the Graph API, Facebook Login and Instagram Login, and Meta's webhook bodies.
# It holds no HTTP client: every call goes through `jt_outbound::Egress` under the `meta`
# connector scope (`jt_archtest` asserts no HTTP client crate is listed or named here).
[dependencies]
jt_app.workspace = true
jt_connector.workspace = true
jt_outbound.workspace = true
serde_json.workspace = true
time.workspace = true
url.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# `appsecret_proof`: HMAC-SHA256 of the access token under the app secret.
hmac.workspace = true
sha2.workspace = true
# `time`: the pause between polls of an Instagram media container.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
# Exercise connector use cases with the real adapter and the in-memory application ports.
jt_testkit.workspace = true
jt_capability.workspace = true
# Plain http to the in-process mock on 127.0.0.1, for the tests only (see jt_outbound's docs).
jt_outbound = { workspace = true, features = ["test-loopback"] }
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
# Captures the adapter's log lines in a test (no provider text may carry a secret into them).
tracing-subscriber.workspace = true

[lints]
workspace = true
