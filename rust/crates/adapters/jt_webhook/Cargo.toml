[package]
name = "jt_webhook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The webhook gate: providers' callbacks into the system (Meta's signed webhooks, NetGSM's
# token-guarded callbacks). An inbound HTTP adapter like `jt_panel_http`, so it may use axum; it
# reaches out nowhere (no HTTP client: the provider adapters it lists are used for their pure
# body parsers only), and it reaches the database only through `jt_app`'s use cases.
[dependencies]
serde_json.workspace = true
jt_app.workspace = true
jt_connector.workspace = true
jt_tenancy.workspace = true
jt_meta.workspace = true
jt_netgsm.workspace = true
axum.workspace = true
# `LengthLimitError`: telling a body over its limit (413) from one that failed to arrive.
http-body-util.workspace = true
# `form_urlencoded`: the query of Meta's verification request.
url.workspace = true
tracing.workspace = true

[dev-dependencies]
jt_capability.workspace = true
# The actor of the acknowledgements the Postgres tests make.
jt_ledger.workspace = true
jt_pg.workspace = true
jt_testkit.workspace = true
async-trait.workspace = true
hex.workspace = true
hmac.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
