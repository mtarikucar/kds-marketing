[package]
name = "jt_mail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jt_app.workspace = true
jt_connector.workspace = true
jt_outbound.workspace = true
jt_tenancy.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
lettre.workspace = true
async-imap.workspace = true
tokio-rustls.workspace = true
mailparse.workspace = true
html5gum = { version = "0.8.4", default-features = false }
# Match the IMAP parser generation to inspect its allocation requirements.
nom = "7"
webpki-roots.workspace = true
futures-util.workspace = true
# async-imap traces raw LOGIN and MIME at trace. Compile those records out, even
# when an operator enables trace globally. This caps the log facade, not tracing.
log = { version = "0.4", features = ["max_level_debug"] }

[dev-dependencies]
jt_outbound = { workspace = true, features = ["test-loopback"] }

[lints]
workspace = true
