[package]
name = "jt_pg"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jt_tenancy.workspace = true
jt_ledger.workspace = true
jt_strategy.workspace = true
jt_capability.workspace = true
jt_connector.workspace = true
jt_app.workspace = true
sqlx.workspace = true
async-trait.workspace = true
serde_json.workspace = true
uuid.workspace = true
time.workspace = true
tracing.workspace = true
# A job lock's guard gives its advisory lock back from `drop` by spawning the unlock onto the
# runtime (`job_lock.rs`).
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
jt_testkit.workspace = true
# `time`: the job-lock test waits for a dropped guard's background unlock.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
