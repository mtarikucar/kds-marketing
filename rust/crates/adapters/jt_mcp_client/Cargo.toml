[package]
name = "jt_mcp_client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The client of a workspace's own shop over MCP (`jt_app::ports::shop::ShopClient`, and the
# `Provider::Mcp` connector that probes it). It holds no HTTP client: every request goes through
# `jt_outbound::Egress` under the workspace's tenant scope (the endpoint's host is a tenant host).
[dependencies]
jt_app.workspace = true
jt_connector.workspace = true
jt_outbound.workspace = true
jt_tenancy.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Plain http to the in-process mock on 127.0.0.1, for the tests only (see jt_outbound's docs).
jt_outbound = { workspace = true, features = ["test-loopback"] }
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
