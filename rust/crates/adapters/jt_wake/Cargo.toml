[package]
name = "jt_wake"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The agent-wake adapter (`jt_app::ports::wake::AgentWaker`): a Claude Code routine's API trigger
# and an agent's own HTTPS webhook. It holds no HTTP client: a routine is fired through
# `jt_outbound::Egress` under the `anthropic` connector scope (its one fixed host), a webhook
# under the `PublicWebhook` scope (public HTTPS hosts only, the DNS guard, no redirects).
[dependencies]
jt_app.workspace = true
jt_outbound.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
url.workspace = true
tracing.workspace = true
async-trait.workspace = true

[dev-dependencies]
# Plain http to the in-process mock on 127.0.0.1, for the tests only (see jt_outbound's docs).
jt_outbound = { workspace = true, features = ["test-loopback"] }
jt_tenancy.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
