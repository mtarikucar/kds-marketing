[package]
name = "jt_testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
jt_tenancy.workspace = true
jt_ledger.workspace = true
jt_strategy.workspace = true
jt_capability.workspace = true
jt_connector.workspace = true
jt_inbox.workspace = true
jt_app.workspace = true
jt_studio.workspace = true
jt_calls.workspace = true
jt_device_protocol.workspace = true
jt_prospects.workspace = true
serde.workspace = true
jt_pg.workspace = true
# For `panel` (the `panel` feature), the panel router in process. `jt_panel_http` lists this
# crate only as a dev-dependency, a cycle Cargo allows; its integration tests share one copy of
# each crate.
jt_panel_http = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, features = ["util"], optional = true }
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
time.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rand.workspace = true
hex.workspace = true
sha2.workspace = true
zeroize.workspace = true

[features]
# The panel's HTTP surface in process (`jt_testkit::panel`). Only the crates whose tests drive
# the panel enable it (`jt_panel_http` and `jeeta`, as dev-dependencies), so the other crates'
# tests build without the panel. In a whole-workspace build Cargo unifies the features, and
# every crate links the one `jt_testkit` with the panel.
panel = ["dep:jt_panel_http", "dep:axum", "dep:tower"]

[lints]
workspace = true
