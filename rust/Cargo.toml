[workspace]
resolver = "2"
members = [
    "crates/domain/jt_tenancy",
    "crates/domain/jt_ledger",
    "crates/jt_app",
    "crates/adapters/jt_pg",
    "crates/adapters/jt_panel_http",
    "crates/adapters/jt_mcp",
    "crates/adapters/jt_outbound",
    "crates/jt_testkit",
    "crates/jt_archtest",
    "bin/jeeta",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Workspace crates
jt_tenancy = { path = "crates/domain/jt_tenancy" }
jt_ledger = { path = "crates/domain/jt_ledger" }
jt_app = { path = "crates/jt_app" }
jt_pg = { path = "crates/adapters/jt_pg" }
jt_panel_http = { path = "crates/adapters/jt_panel_http" }
jt_mcp = { path = "crates/adapters/jt_mcp" }
jt_outbound = { path = "crates/adapters/jt_outbound" }
jt_testkit = { path = "crates/jt_testkit" }
jt_archtest = { path = "crates/jt_archtest" }

# Third-party crates
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "time", "json"] }
rmcp = { version = "3.6", features = ["server", "transport-streamable-http-server", "transport-io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.6"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
base64 = "0.23"
subtle = "2"
schemars = "1"
url = "2"
dotenvy = "0.15"
toml = "1"
async-trait = "0.1"
http = "1"
tower-service = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
