name: Release Deploy

# Tag-driven production deploy to the shared box (38.242.233.166) — the same
# machine and pattern as the kds monorepo's release-deploy.yml, scoped to the
# marketing stack (ports 3210/3211, own postgres on 5434). The vhost flip
# that points marketing.hummytummy.com at this stack is a ONE-TIME operation
# in cutover.yml; ordinary releases just swap images behind it.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must exist'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: marketing-production-deploy
  cancel-in-progress: false

env:
  SERVER_HOST: '38.242.233.166'
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  DEPLOY_DIR: /root/kds-marketing

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  # No test job here: a release tag is cut from a main commit that ci.yml has
  # already fully validated (unit + e2e + realdb + build + migration parity), so
  # re-running the unit suite here only duplicated that work and serialised the
  # pipeline (~10 min on the critical path). The deploy health-gate is the final
  # safety net. The two image builds run in PARALLEL instead of one sequential job.

  build-backend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/backend:current
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/backend:buildcache,mode=max

  build-frontend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: production
          push: true
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_API_URL || 'https://jeetagrowth.com/api' }}
            VITE_APP_TITLE=${{ vars.APP_TITLE || 'Marketing Console' }}
            VITE_APP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_BASE }}/frontend:current
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/frontend:buildcache,mode=max

  deploy:
    needs: [version, build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          server-host: ${{ env.SERVER_HOST }}

      - name: Render .env.production
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MARKETING_POSTGRES_PASSWORD: ${{ secrets.MARKETING_POSTGRES_PASSWORD }}
          MARKETING_JWT_SECRET: ${{ secrets.MARKETING_JWT_SECRET }}
          # Research sources (lead research, intake site crawl, strategist
          # research tools). Absent, ResearchSourcesService is deliberately
          # inert — every research run completes with zero candidates, which is
          # exactly what prod silently did until 2026-08-12.
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MARKETING_JWT_REFRESH_SECRET: ${{ secrets.MARKETING_JWT_REFRESH_SECRET }}
          PLATFORM_JWT_SECRET: ${{ secrets.PLATFORM_JWT_SECRET }}
          RESEARCH_ROUTINE_TOKEN: ${{ secrets.RESEARCH_ROUTINE_TOKEN }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          # Routine trigger layer: x-routine-token for the internal data API +
          # AES master key that seals panel-stored claude.ai trigger tokens.
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          MARKETING_SECRET_KEY: ${{ secrets.MARKETING_SECRET_KEY }}
          # Anthropic billing key. OPTIONAL: if unset, all AI features stay
          # dormant (graceful no-op) — never fails the deploy.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GHL-parity env-gated integrations. ALL OPTIONAL — unset = that
          # integration stays inert (never fails the deploy). Set the GitHub
          # secret to activate. See docs/ops/ghl-parity-setup.md.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Instagram API with Instagram Login (direct IG connect, no FB Page) —
          # distinct app credentials; the connector stays inert unless BOTH are set.
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          # Facebook Login for Business: the configuration id that bundles the
          # publish permissions (avoids "Invalid Scopes" on the raw scope flow).
          META_LOGIN_CONFIG_ID: ${{ secrets.META_LOGIN_CONFIG_ID }}
          # Meta webhook (WhatsApp/Messenger/Instagram inbound + delivery receipts):
          # the GET-handshake verify token (any string; must match what you paste in
          # the Meta App webhook config). Without it the webhook subscription 403s.
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          # Graph API version for ALL Meta calls (optional; empty = code default v19.0).
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          # The READ half of each social grant, one switch per provider's app
          # review. Unset = the connect flows ask for exactly what they ask for
          # today and the organic-insights sweep is refused by every network,
          # which it reports honestly. Set one to `1` AFTER that provider's
          # review clears; accounts connected before the flip keep the token
          # they were minted with and have to be reconnected.
          # See scopesFor()/INSIGHTS_SCOPES in social-oauth.config.ts.
          META_INSIGHTS_SCOPES: ${{ vars.META_INSIGHTS_SCOPES }}
          IG_LOGIN_INSIGHTS_SCOPES: ${{ vars.IG_LOGIN_INSIGHTS_SCOPES }}
          TIKTOK_INSIGHTS_SCOPES: ${{ vars.TIKTOK_INSIGHTS_SCOPES }}
          # LinkedIn's Community Management API — org posting AND org insights.
          # Was read from the server's own .env only; wiring it here means the
          # deploy stops silently reverting whatever ops set by hand.
          LINKEDIN_ORG_SCOPES: ${{ vars.LINKEDIN_ORG_SCOPES }}
          # WhatsApp Embedded Signup configuration id (Facebook Login for Business
          # config) — enables the tenant one-click "Connect WhatsApp" button.
          META_WHATSAPP_CONFIG_ID: ${{ vars.META_WHATSAPP_CONFIG_ID }}
          # Cloudflare R2 (S3-compatible) media storage for social-planner uploads.
          # OPTIONAL — unset = upload endpoint inert, users paste public URLs instead.
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          # fal.ai queue provider for AI Social Content Studio (photo/video gen).
          # OPTIONAL — unset FAL_KEY = media generation inert (provider
          # isConfigured()=false, endpoints 503). FAL_WEBHOOK_SECRET gates the
          # public fal completion callback; unset = poll-only fallback path.
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_WEBHOOK_SECRET: ${{ secrets.FAL_WEBHOOK_SECRET }}
          # HMAC-SHA256 key the inbound-email webhook verifies the raw body
          # against. Without it /api/public/channels/email/webhook answers 401
          # to everything, so a connected mailbox can SEND but no customer reply
          # ever reaches the inbox — and the channel dialog says so in as many
          # words ("an admin must set EMAIL_INBOUND_SECRET on the server").
          # It was missing here entirely: setting it on the box by hand worked
          # until the next release, because the step below rebuilds
          # .env.production from scratch every deploy.
          EMAIL_INBOUND_SECRET: ${{ secrets.EMAIL_INBOUND_SECRET }}
          # Mailbox connect WITHOUT a password: the Google / Microsoft app
          # registrations the consent flow runs on (EMAIL_OAUTH in
          # channels/email-oauth.config.ts). ALL OPTIONAL — unset means
          # isEmailOAuthConfigured() is false and that provider's button is
          # simply not offered, which is the honest off state. Set them only
          # once the app exists AND the callback
          # https://jeetagrowth.com/api/marketing/channels/email/oauth/callback
          # is registered on it; a half-registered app dies on the provider's
          # own redirect_uri_mismatch page, which is worse than no button.
          #
          # These are NOT the GOOGLE_OAUTH_* pair above — that is the
          # Calendar/SSO registration, which has neither the gmail.send scope
          # nor this callback URI. Separate apps, separate secrets, on purpose.
          #
          # `secrets.` for all four, including the client ids: a client id is
          # half of an app credential and belongs beside its secret, not in a
          # world-readable repo Variable (same exemption the social OAuth block
          # documents).
          GOOGLE_MAIL_CLIENT_ID: ${{ secrets.GOOGLE_MAIL_CLIENT_ID }}
          GOOGLE_MAIL_CLIENT_SECRET: ${{ secrets.GOOGLE_MAIL_CLIENT_SECRET }}
          MICROSOFT_MAIL_CLIENT_ID: ${{ secrets.MICROSOFT_MAIL_CLIENT_ID }}
          MICROSOFT_MAIL_CLIENT_SECRET: ${{ secrets.MICROSOFT_MAIL_CLIENT_SECRET }}
          # HMAC key the bounce/complaint feed is verified with
          # (POST /api/public/esp/feedback). Unset, every delivery report is
          # answered NOT_CONFIGURED, so nothing a receiving domain tells us
          # about a dead address ever reaches the suppression list and the
          # same address is mailed again next campaign.
          ESP_FEEDBACK_SECRET: ${{ secrets.ESP_FEEDBACK_SECRET }}
          # The SAME feed, per real provider. `POST /api/public/esp/feedback/:provider`
          # picks its verifier from the URL and each one is dark until ITS key is
          # here — the generic HMAC above is a shape no ESP actually produces.
          # Forwarded even though none is adopted today: an operator who pastes
          # SendGrid's key into Secrets and points the Signed Event Webhook at us
          # would otherwise get 401 on every event forever, because the heredoc
          # below is what builds .env.production from scratch on each release.
          # Empty renders `KEY=`, which every verifier reads as NOT_CONFIGURED —
          # the correct off state, and free for anyone who never adopts an ESP.
          #
          # SENDGRID_EVENT_PUBLIC_KEY really is public (it only VERIFIES; nothing
          # we hold can mint an event) but keeps the `secrets.` home its _KEY name
          # asks for. POSTMARK_WEBHOOK_USER is half of a basic-auth pair and
          # belongs beside its password in Secrets despite the suffix-less name —
          # the same exemption the mail-client-id block above documents.
          SENDGRID_EVENT_PUBLIC_KEY: ${{ secrets.SENDGRID_EVENT_PUBLIC_KEY }}
          MAILGUN_WEBHOOK_SIGNING_KEY: ${{ secrets.MAILGUN_WEBHOOK_SIGNING_KEY }}
          POSTMARK_WEBHOOK_USER: ${{ secrets.POSTMARK_WEBHOOK_USER }}
          POSTMARK_WEBHOOK_PASSWORD: ${{ secrets.POSTMARK_WEBHOOK_PASSWORD }}
          # Postmark's OPTIONAL egress allow-list, comma separated. A Variable,
          # not a Secret: it is a published IP range and an operator has to be
          # able to see and edit it when Postmark moves one. Unset = unenforced,
          # which is deliberate — a stale list drops every bounce silently.
          POSTMARK_WEBHOOK_IPS: ${{ vars.POSTMARK_WEBHOOK_IPS }}
          # Kill switch for the cron that reads the PLATFORM mailbox (EMAIL_USER)
          # for the bounces of platform mail. Empty = on, which is the intended
          # state. Set it to `off` to stop the poller touching a live human's
          # INBOX without waiting for a code deploy.
          PLATFORM_BOUNCE_POLL: ${{ vars.PLATFORM_BOUNCE_POLL }}
          # Platform DKIM. BOTH halves or nothing is signed — a half-configured
          # deploy stays byte-identical to an unsigned one (email.service.ts
          # platformDkim()). The selector is the public DNS label, so a repo
          # Variable; the PEM travels base64 because .env is written line by
          # line and a multi-line value would corrupt the file.
          EMAIL_DKIM_SELECTOR: ${{ vars.EMAIL_DKIM_SELECTOR }}
          EMAIL_DKIM_PRIVATE_KEY_B64: ${{ secrets.EMAIL_DKIM_PRIVATE_KEY_B64 }}
          # The host bulk links (click redirect, open pixel, unsubscribe) go out
          # on. Unset it IS PUBLIC_BASE_URL, which is today's behaviour. Point
          # it at a separate hostname so one tenant's campaign URL getting
          # listed cannot take login, invoice and password-reset mail with it.
          LINK_BASE_URL: ${{ vars.LINK_BASE_URL }}
          # Runware — second media vendor for the catalogue models that carry a
          # `runware` binding (Seedance 2.5, Seedance 1.0 Pro Fast, Qwen-Image,
          # BiRefNet). OPTIONAL — unset = every model stays on fal.
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          # LinkedIn REST API version for EVERY /rest call — publishing, ads
          # read + write, audiences, insights (optional; empty = the code default
          # LINKEDIN_DEFAULT_API_VERSION in common/util/linkedin-api.util.ts).
          # Wired here because the failure message tells the operator to "set
          # LINKEDIN_API_VERSION", and this file renders the prod env file
          # wholesale: without this line the knob did not exist in prod and
          # anything set on the server by hand was erased by the next deploy.
          # Set this repo Variable to a version LinkedIn still serves to recover
          # from "Requested version <YYYYMM>01 is not active" without a code
          # change; leave it unset to track the code default.
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          # Pinterest's publish adapter, OAuth flow and catalogue entry all
          # shipped; the credentials never did, so its Connect button was
          # permanently disabled no matter what the owner put in repo Secrets.
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STRIPE_CONNECT_CLIENT_ID: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
          BANK_IBAN: ${{ secrets.BANK_IBAN }}
          BANK_ACCOUNT_NAME: ${{ secrets.BANK_ACCOUNT_NAME }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Optional: gates /api/metrics. If unset the endpoint relies on the
          # edge network restriction alone (host-nginx should not proxy it).
          METRICS_SCRAPE_TOKEN: ${{ secrets.METRICS_SCRAPE_TOKEN }}
          # NetGSM click-to-dial sales line (telephony only, optional). NOTE: the
          # NetGSM *SMS* credentials (usercode/password/msgheader) are NOT env vars —
          # they live per-channel, sealed in the DB (set via Channels settings UI).
          NETGSM_SALES_LINE: ${{ secrets.NETGSM_SALES_LINE }}
          # NetGSM dynamic-IVR inbound webhook token (optional). Gates the public
          # /api/public/telephony/netgsm-ivr/:token route — the route 404s (IVR
          # stays inert) until this is set. Any long random string; the SAME value
          # goes into the URL pasted into NetGSM's "Özel API (Custom)" panel.
          NETGSM_IVR_TOKEN: ${{ secrets.NETGSM_IVR_TOKEN }}
          # Post-call AI analysis STT (optional; unset = transcription disabled).
          STT_PROVIDER: ${{ secrets.STT_PROVIDER }}
          STT_API_KEY: ${{ secrets.STT_API_KEY }}
          LOCAL_AI_URL: ${{ vars.LOCAL_AI_URL }}
          LOCAL_AI_TOKEN: ${{ secrets.LOCAL_AI_TOKEN }}
          LOCAL_AI_WHISPER_SIZE: ${{ vars.LOCAL_AI_WHISPER_SIZE }}
          # External AI-voice partner bridge (VAPI/Retell/ElevenLabs custom-LLM)
          # shared secret (optional; unset = bridge endpoints stay inert).
          VOICE_AI_BRIDGE_SECRET: ${{ secrets.VOICE_AI_BRIDGE_SECRET }}
          # Growth Autopilot autonomy (owner-approved LIVE 2026-07). '1' arms the
          # AUTONOMOUS lane globally: a workspace that loads credit + flips the
          # switch gets real, approval-free budget reallocation on its connected
          # ad accounts (Mode-1: the ad network bills the customer's own account;
          # Kill-switch + anomaly auto-stop are the safety rails). Set to 0/unset
          # to instantly fall back to ASSISTED (propose-and-approve) everywhere.
          GROWTH_AUTOPILOT_AUTONOMY: ${{ vars.GROWTH_AUTOPILOT_AUTONOMY }}
          # Epic-13 platform features. ALL OPTIONAL and ALL OFF unless set —
          # /billing/summary publishes them as entitlement flags (prospecting /
          # sendingDomains / customDomains) that the SPA nav reads, so an unset
          # one keeps its menu item hidden exactly as it is today. Setting one
          # here is the ONLY thing needed to reveal the feature.
          # Prospecting audit: a free Google PageSpeed Insights API key.
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          # Sending domains / DKIM: the transactional ESP that sends from a
          # tenant domain (the shared SMTP is not one) + the platform host
          # tenants add to their SPF record. Non-secret -> repo Variables.
          SENDING_DOMAIN_ESP: ${{ vars.SENDING_DOMAIN_ESP }}
          SENDING_DOMAIN_SPF_INCLUDE: ${{ vars.SENDING_DOMAIN_SPF_INCLUDE }}
          # Custom-domain white-label: set to '1' ONLY once wildcard ingress +
          # on-demand ACME TLS exist (the app cannot provision them). The CNAME
          # target is the ingress host tenants point their own hostname at;
          # unset leaves the placeholder default, so set it with the flag.
          CUSTOM_DOMAINS_ENABLED: ${{ vars.CUSTOM_DOMAINS_ENABLED }}
          CUSTOM_DOMAIN_CNAME_TARGET: ${{ vars.CUSTOM_DOMAIN_CNAME_TARGET }}
          # Platform-owner workspace bootstrap (all OPTIONAL — unset = the seed
          # no-ops and the deploy is unaffected). OPERATOR_WORKSPACE_ID puts that
          # one workspace on the internal OPERATOR package on every boot; the two
          # PLATFORM_OPERATOR_* secrets seed/rotate the superadmin login.
          # See docs/marketing/platform-package-assignment.md.
          OPERATOR_WORKSPACE_ID: ${{ secrets.OPERATOR_WORKSPACE_ID }}
          PLATFORM_OPERATOR_EMAIL: ${{ secrets.PLATFORM_OPERATOR_EMAIL }}
          PLATFORM_OPERATOR_PASSWORD: ${{ secrets.PLATFORM_OPERATOR_PASSWORD }}
        run: |
          set -euo pipefail
          required=(MARKETING_POSTGRES_PASSWORD MARKETING_JWT_SECRET
                    MARKETING_JWT_REFRESH_SECRET PLATFORM_JWT_SECRET
                    RESEARCH_ROUTINE_TOKEN INTERNAL_SERVICE_TOKEN)
          missing=0
          for k in "${required[@]}"; do
            [ -n "${!k:-}" ] || { echo "::error::secret $k is missing"; missing=1; }
          done
          [ "$missing" -eq 0 ]

          # PSP + email values that must MATCH core's live config are read on
          # the server from /root/kds-marketing/.env.shared (extracted from
          # core's .env.production by the bootstrap workflow) and appended
          # below — they never transit the runner.
          cat > .env.rendered <<ENV
          # ── rendered by deploy.yml for ${VERSION} ──
          NODE_ENV=production
          PORT=3000
          IMAGE_TAG=${VERSION}
          # connection_limit 40 + pool_timeout 20: at Prisma's default (13 for
          # this container's CPU count, 10s timeout) the top-of-hour scheduler
          # fan-out exhausted the pool 26 times in 6h — every cron that fired
          # in the storm failed with P2024 instead of queueing briefly. Postgres
          # max_connections (100 default) comfortably covers 40 + the platform
          # container + psql sessions.
          DATABASE_URL=postgresql://marketing:${MARKETING_POSTGRES_PASSWORD}@postgres:5432/marketing?schema=public&connection_limit=40&pool_timeout=20
          MARKETING_POSTGRES_PASSWORD=${MARKETING_POSTGRES_PASSWORD}
          # Distributed rate-limit store (the redis service in docker-compose.prod.yml).
          REDIS_URL=redis://redis:6379
          # Research sources — see the env: block above for why these matter.
          FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
          APIFY_TOKEN=${APIFY_TOKEN}
          MARKETING_JWT_SECRET=${MARKETING_JWT_SECRET}
          MARKETING_JWT_REFRESH_SECRET=${MARKETING_JWT_REFRESH_SECRET}
          PLATFORM_JWT_SECRET=${PLATFORM_JWT_SECRET}
          RESEARCH_ROUTINE_TOKEN=${RESEARCH_ROUTINE_TOKEN}
          INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
          ROUTINE_TOKEN=${ROUTINE_TOKEN}
          MARKETING_SECRET_KEY=${MARKETING_SECRET_KEY}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          # GHL-parity integrations (optional; empty = inert).
          GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
          GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
          META_APP_ID=${META_APP_ID}
          META_APP_SECRET=${META_APP_SECRET}
          INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
          INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
          META_LOGIN_CONFIG_ID=${META_LOGIN_CONFIG_ID}
          META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
          GRAPH_API_VERSION=${GRAPH_API_VERSION}
          META_INSIGHTS_SCOPES=${META_INSIGHTS_SCOPES}
          IG_LOGIN_INSIGHTS_SCOPES=${IG_LOGIN_INSIGHTS_SCOPES}
          TIKTOK_INSIGHTS_SCOPES=${TIKTOK_INSIGHTS_SCOPES}
          LINKEDIN_ORG_SCOPES=${LINKEDIN_ORG_SCOPES}
          META_WHATSAPP_CONFIG_ID=${META_WHATSAPP_CONFIG_ID}
          R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
          R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
          R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
          R2_BUCKET=${R2_BUCKET}
          R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
          # AI media generation (fal.ai); empty = inert.
          FAL_KEY=${FAL_KEY}
          FAL_WEBHOOK_SECRET=${FAL_WEBHOOK_SECRET}
          # Inbound email (customer replies); empty = the webhook 401s and the
          # email channel is send-only. Rendered here rather than appended after
          # .env.shared because core has no such key, so there is nothing to
          # lose a last-wins race against.
          EMAIL_INBOUND_SECRET=${EMAIL_INBOUND_SECRET}
          # Mailbox consent apps (Google / Microsoft); empty = that provider's
          # Connect button is not offered. See the env: block above for why
          # these are NOT the GOOGLE_OAUTH_* Calendar pair.
          GOOGLE_MAIL_CLIENT_ID=${GOOGLE_MAIL_CLIENT_ID}
          GOOGLE_MAIL_CLIENT_SECRET=${GOOGLE_MAIL_CLIENT_SECRET}
          MICROSOFT_MAIL_CLIENT_ID=${MICROSOFT_MAIL_CLIENT_ID}
          MICROSOFT_MAIL_CLIENT_SECRET=${MICROSOFT_MAIL_CLIENT_SECRET}
          # Bounce/complaint feed HMAC; empty = the feed 401s and nothing is
          # ever suppressed from a delivery report.
          ESP_FEEDBACK_SECRET=${ESP_FEEDBACK_SECRET}
          # Per-provider feedback credentials for /esp/feedback/:provider; empty
          # = that provider's verifier answers NOT_CONFIGURED and its events 401.
          # POSTMARK_WEBHOOK_IPS is the optional allow-list; empty = unenforced.
          SENDGRID_EVENT_PUBLIC_KEY=${SENDGRID_EVENT_PUBLIC_KEY}
          MAILGUN_WEBHOOK_SIGNING_KEY=${MAILGUN_WEBHOOK_SIGNING_KEY}
          POSTMARK_WEBHOOK_USER=${POSTMARK_WEBHOOK_USER}
          POSTMARK_WEBHOOK_PASSWORD=${POSTMARK_WEBHOOK_PASSWORD}
          POSTMARK_WEBHOOK_IPS=${POSTMARK_WEBHOOK_IPS}
          # Platform-bounce cron kill switch; empty = the poller runs.
          PLATFORM_BOUNCE_POLL=${PLATFORM_BOUNCE_POLL}
          # Platform DKIM (both halves or unsigned). Rendered here, like
          # EMAIL_INBOUND_SECRET and unlike EMAIL_HOST/USER/FROM/PASSWORD, so
          # the key travels with the deploy instead of being hand-placed on the
          # box and erased by the next release. The signing domain follows the
          # EMAIL_FROM appended below (admin@jeetagrowth.com). If core ever
          # starts exporting EMAIL_DKIM_* in .env.shared that copy would win
          # (appended after, last-wins) — look there first if `d=` comes out
          # wrong.
          EMAIL_DKIM_SELECTOR=${EMAIL_DKIM_SELECTOR}
          EMAIL_DKIM_PRIVATE_KEY_B64=${EMAIL_DKIM_PRIVATE_KEY_B64}
          # Separate host for bulk links; empty = PUBLIC_BASE_URL (unchanged).
          LINK_BASE_URL=${LINK_BASE_URL}
          # Runware media vendor (per-model routing); empty = all on fal.
          RUNWARE_API_KEY=${RUNWARE_API_KEY}
          LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
          LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
          # Empty unless the repo Variable is set — an unparseable/blank value
          # falls back to LINKEDIN_DEFAULT_API_VERSION in code, by design.
          LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION}
          TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
          TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
          X_CLIENT_ID=${X_CLIENT_ID}
          X_CLIENT_SECRET=${X_CLIENT_SECRET}
          PINTEREST_APP_ID=${PINTEREST_APP_ID}
          PINTEREST_APP_SECRET=${PINTEREST_APP_SECRET}
          REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
          REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
          STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID}
          MARKETING_PUBLIC_URL=https://jeetagrowth.com
          # Public origin for callback/tracking links the API emits (NetGSM MO
          # callbackUrl, campaign tracking, Twilio voice signature). Without it the
          # SMS channel's MO URL renders null and the operator can't wire NetGSM.
          PUBLIC_BASE_URL=https://jeetagrowth.com
          CORE_SERVICE_URL=http://host.docker.internal:3000
          CORS_ORIGIN=https://jeetagrowth.com,https://www.jeetagrowth.com
          FRONTEND_URL=https://jeetagrowth.com
          APP_NAME=Jeeta
          APP_URL=https://jeetagrowth.com
          BANK_IBAN=${BANK_IBAN}
          BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME}
          PAYTR_TEST_MODE=0
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          METRICS_SCRAPE_TOKEN=${METRICS_SCRAPE_TOKEN}
          # NetGSM click-to-dial sales line (telephony only; empty = inert). SMS
          # creds are per-channel in the DB, not here.
          NETGSM_SALES_LINE=${NETGSM_SALES_LINE}
          # NetGSM dynamic IVR + post-call STT + AI-voice bridge (all optional;
          # empty = each surface stays inert, never fails the deploy).
          NETGSM_IVR_TOKEN=${NETGSM_IVR_TOKEN}
          STT_PROVIDER=${STT_PROVIDER}
          STT_API_KEY=${STT_API_KEY}
          LOCAL_AI_URL=${LOCAL_AI_URL}
          LOCAL_AI_TOKEN=${LOCAL_AI_TOKEN}
          LOCAL_AI_WHISPER_SIZE=${LOCAL_AI_WHISPER_SIZE}
          VOICE_AI_BRIDGE_SECRET=${VOICE_AI_BRIDGE_SECRET}
          # Growth Autopilot autonomy (repo Variable GROWTH_AUTOPILOT_AUTONOMY).
          # '1' arms the AUTONOMOUS lane; empty/0 = ASSISTED fallback everywhere.
          GROWTH_AUTOPILOT_AUTONOMY=${GROWTH_AUTOPILOT_AUTONOMY}
          # Epic-13 platform features (all optional; empty = feature inert and
          # its nav item hidden — identical to not rendering the line at all).
          PAGESPEED_API_KEY=${PAGESPEED_API_KEY}
          SENDING_DOMAIN_ESP=${SENDING_DOMAIN_ESP}
          SENDING_DOMAIN_SPF_INCLUDE=${SENDING_DOMAIN_SPF_INCLUDE}
          CUSTOM_DOMAINS_ENABLED=${CUSTOM_DOMAINS_ENABLED}
          CUSTOM_DOMAIN_CNAME_TARGET=${CUSTOM_DOMAIN_CNAME_TARGET}
          # Platform-owner bootstrap (optional; empty = each seed no-ops). Both
          # PLATFORM_OPERATOR_* must be set together — the seed rotates the
          # superadmin password (and kills its old sessions) on every deploy.
          OPERATOR_WORKSPACE_ID=${OPERATOR_WORKSPACE_ID}
          PLATFORM_OPERATOR_EMAIL=${PLATFORM_OPERATOR_EMAIL}
          PLATFORM_OPERATOR_PASSWORD=${PLATFORM_OPERATOR_PASSWORD}
          ENV

      - name: Ship env + compose (atomic)
        env:
          # Marketing sender identity = admin@jeetagrowth.com (GoDaddy secureserver
          # mailbox). Appended AFTER .env.shared below so it overrides core's
          # admin@hummytummy.com EMAIL_* values for the MARKETING stack only.
          # Optional: if the secret is unset the app falls back to .env.shared /
          # mock-mode (never fails the deploy).
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          set -euo pipefail
          # base64 so the value survives the trip. It is interpolated into a
          # double-quoted ssh command and lands inside SINGLE quotes on the far
          # side, so a password containing an apostrophe would close the quote
          # early and write a corrupted EMAIL_PASSWORD line. The mail host then
          # answers 535 — indistinguishable from simply having the wrong
          # password, which is the worst way for this to fail. base64 output is
          # [A-Za-z0-9+/=] and safe in any shell context.
          EMAIL_PASSWORD_B64=$(printf '%s' "${EMAIL_PASSWORD:-}" | base64 -w0)
          scp -o ServerAliveInterval=15 .env.rendered \
            root@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/.env.rendered.new
          scp -o ServerAliveInterval=15 docker-compose.prod.yml \
            root@${{ env.SERVER_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.prod.yml.new
          ssh root@${{ env.SERVER_HOST }} "
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            # Final env = rendered part + shared (PSP/email) part from core.
            cat .env.rendered.new > .env.production.new
            if [ -f .env.shared ]; then cat .env.shared >> .env.production.new; fi
            # Marketing sender override (jeetagrowth.com mailbox). These come AFTER
            # .env.shared so they win over core's admin@hummytummy.com EMAIL_*
            # (dotenv + docker compose env_file are both last-wins). secure is
            # derived from port===465 in the mailer, so 587 → STARTTLS.
            if [ -n \"${EMAIL_PASSWORD_B64}\" ]; then
              echo 'EMAIL_HOST=smtpout.secureserver.net' >> .env.production.new
              echo 'EMAIL_PORT=587' >> .env.production.new
              echo 'EMAIL_USER=admin@jeetagrowth.com' >> .env.production.new
              echo 'EMAIL_FROM=admin@jeetagrowth.com' >> .env.production.new
              printf 'EMAIL_PASSWORD=%s\n' \"\$(printf %s '${EMAIL_PASSWORD_B64}' | base64 -d)\" >> .env.production.new
            fi
            rm .env.rendered.new
            chmod 600 .env.production.new
            mv .env.production.new .env.production
            cp .env.production .env   # compose interpolation reads ./.env
            mv docker-compose.prod.yml.new docker-compose.prod.yml
          "

      # Remember what is CURRENTLY serving, before anything is swapped.
      #
      # `up -d` destroys the running container, so by the time the health gate
      # below fails there is nothing left to fall back to and no record of what
      # was there — which is how a failed boot became a manual outage rather
      # than a failed-safe deploy. The tag is read off the live container rather
      # than from .env.production because the env file is rewritten by the step
      # above: on a re-run or a partial failure it may already name the version
      # we are trying to escape from.
      - name: Remember the currently-serving tag
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 root@${{ env.SERVER_HOST }} "
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            prev=\$(docker inspect --format '{{.Config.Image}}' kds_marketing_api 2>/dev/null | sed 's/.*://' || true)
            if [ -n \"\$prev\" ] && [ \"\$prev\" != 'current' ]; then
              echo \"\$prev\" > .last-good-tag
              echo \"previous good tag: \$prev\"
            else
              rm -f .last-good-tag
              echo 'no previous tag recorded (first deploy or unpinned image) — rollback will be skipped'
            fi
          "

      - name: Pull + swap + health-gate
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 root@${{ env.SERVER_HOST }} "
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            echo 'waiting for API health on :3211 ...'
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                http://localhost:3211/api/marketing/billing/packages || true)
              if [ \"\$code\" = '200' ]; then
                echo \"API healthy (attempt \$i)\"
                exit 0
              fi
              sleep 5
            done
            echo '::error::API did not become healthy — recent backend logs:'
            docker logs --tail 80 kds_marketing_api || true
            exit 1
          "

      # The failed-safe half. Without it, a health-gate failure leaves production
      # down until a human notices — the old container is already gone.
      #
      # 🔴 THIS RESTORES THE APPLICATION, NOT THE DATABASE. Migrations run at
      # container boot (`prisma migrate deploy` in the compose command) and
      # Prisma has no down migrations, so anything the new release's SQL already
      # applied stays applied. Rolling back to an older image means running that
      # image against a NEWER schema. Additive migrations (a new table, a new
      # nullable column, an index) are safe that way and are the shape this repo
      # ships; a destructive one is not, and the release notes have to say so.
      #
      # It also cannot help when the failure IS the migration: a migration that
      # aborts leaves a failed row in `_prisma_migrations`, and every later boot
      # — including this rollback's — stops with P3009 until someone runs
      # `prisma migrate resolve`. The step says so out loud rather than looping.
      - name: Roll back to the previous tag
        if: failure()
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=15 root@${{ env.SERVER_HOST }} "
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            if [ ! -f .last-good-tag ]; then
              echo '::error::no previous tag recorded — cannot roll back automatically'
              exit 1
            fi
            prev=\$(cat .last-good-tag)
            echo \"rolling back to \$prev\"
            if docker logs --tail 200 kds_marketing_api 2>&1 | grep -q 'P3009'; then
              echo '::error::a migration failed and is recorded as failed (P3009). Rolling the image back will NOT clear it — the next boot aborts too. Run: docker compose run --rm --no-deps backend npx prisma migrate resolve --rolled-back <name>'
            fi
            sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=\$prev/\" .env.production
            cp .env.production .env
            docker compose -f docker-compose.prod.yml up -d
            echo 'waiting for the restored API ...'
            for i in \$(seq 1 24); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 5                 http://localhost:3211/api/marketing/billing/packages || true)
              if [ \"\$code\" = '200' ]; then
                echo \"::warning::deploy failed; rolled back to \$prev and it is serving (attempt \$i)\"
                exit 0
              fi
              sleep 5
            done
            echo '::error::rollback did NOT come up either — production is down, manual intervention required:'
            docker logs --tail 120 kds_marketing_api || true
            exit 1
          "

      - name: Disk cleanup
        if: success()
        run: |
          ssh root@${{ env.SERVER_HOST }} \
            'docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true'
