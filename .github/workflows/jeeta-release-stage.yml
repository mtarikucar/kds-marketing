name: Jeeta verified staging release
on:
  push:
    branches: [ops/release-dd66e8dc]
    paths: [.github/workflows/jeeta-release-stage.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: jeeta-staging-operation
  cancel-in-progress: false
jobs:
  candidate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the complete exact-revision Rust pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            gh api repos/mtarikucar/kds-marketing/actions/runs/42592542273 > "$RUNNER_TEMP/candidate-run.json"
            python3 - "$RUNNER_TEMP/candidate-run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['head_sha']=='19093007ceec63c4e47a459e8b2019d9c515ebe8'
          assert r['event']=='push' and r['path']=='.github/workflows/rust.yml'
          print('Candidate CI:',r['status'],r['conclusion'])
          PY
            if test "$(jq -r .status "$RUNNER_TEMP/candidate-run.json")" = completed; then
              test "$(jq -r .conclusion "$RUNNER_TEMP/candidate-run.json")" = success
              exit 0
            fi
            sleep 30
          done
          echo '::error::Full candidate CI has not passed; no deployment'
          exit 1
  publish-staging:
    needs: candidate-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13661438398'
          run-id: '42592542273'
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - name: Verify the reviewed archive and operator script
        run: |
          set -euo pipefail
          printf '%s  %s\n' c90a4c3cd55c4dafe89b0d8b9171e8494292edd22b3de1b6c2315dfffa10838c candidate/jeeta-release.tar | sha256sum --check --status
          printf '%s  %s\n' 2384b3842a482382f1f986413ad41a6f58b8f57e4e81b241a573301d1a94e216 ops/publish-release.sh | sha256sum --check --status
          bash -n ops/publish-release.sh
          chmod 0600 candidate/jeeta-release.tar
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          server-host: '38.242.233.166'
      - name: Transfer the verified complete candidate
        run: |
          set -euo pipefail
          scp -o BatchMode=yes candidate/jeeta-release.tar root@38.242.233.166:/root/jeeta-release-19093007.tar
          ssh -o BatchMode=yes root@38.242.233.166 'chmod 0600 /root/jeeta-release-19093007.tar'
      - name: Verify backup restoration and migration before staging swap
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 root@38.242.233.166 \
            'bash -s -- staging 19093007ceec63c4e47a459e8b2019d9c515ebe8 c90a4c3cd55c4dafe89b0d8b9171e8494292edd22b3de1b6c2315dfffa10838c' < ops/publish-release.sh
      - name: Read nonsecret publication receipt
        run: |
          ssh -o BatchMode=yes root@38.242.233.166 'cat /var/backups/jeeta-release/promotions/19093007ceec63c4e47a459e8b2019d9c515ebe8.staging.json' > staging-receipt.json
          cat staging-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-staging-19093007-receipt
          path: staging-receipt.json
          retention-days: 14
