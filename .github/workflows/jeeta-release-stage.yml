name: Jeeta verified staging release
on:
  push:
    branches: [ops/release-dd66e8dc]
    paths: [.github/workflows/jeeta-release-stage.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: jeeta-staging-operation
  cancel-in-progress: false
jobs:
  candidate-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the complete exact-revision Rust pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            gh api repos/mtarikucar/kds-marketing/actions/runs/42589999298 > "$RUNNER_TEMP/candidate-run.json"
            python3 - "$RUNNER_TEMP/candidate-run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['head_sha']=='7955e72126e0b0596821dcc98efa3fb75117b6d1'
          assert r['event']=='push' and r['path']=='.github/workflows/rust.yml'
          print('Candidate CI:',r['status'],r['conclusion'])
          PY
            if test "$(jq -r .status "$RUNNER_TEMP/candidate-run.json")" = completed; then
              test "$(jq -r .conclusion "$RUNNER_TEMP/candidate-run.json")" = success
              exit 0
            fi
            sleep 30
          done
          echo '::error::Full candidate CI has not passed; no deployment'
          exit 1
  publish-staging:
    needs: candidate-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13661530532'
          run-id: '42589999298'
          github-token: ${{ github.token }}
          path: candidate
          merge-multiple: true
      - name: Verify the reviewed archive and operator script
        run: |
          set -euo pipefail
          printf '%s  %s\n' ad64eb76600ca28b9312807f942630790e5d9d2e32ed1f86d75763e5c1e9d4f7 candidate/jeeta-release.tar | sha256sum --check --status
          printf '%s  %s\n' fe872adfad1e48661b3aa127d4b7e6eac5ea683eb347170cc9c3764e346c11d1 ops/publish-release.sh | sha256sum --check --status
          bash -n ops/publish-release.sh
          chmod 0600 candidate/jeeta-release.tar
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          server-host: '38.242.233.166'
      - name: Transfer the verified complete candidate
        run: |
          set -euo pipefail
          scp -o BatchMode=yes candidate/jeeta-release.tar root@38.242.233.166:/root/jeeta-release-7955e721.tar
          ssh -o BatchMode=yes root@38.242.233.166 'chmod 0600 /root/jeeta-release-7955e721.tar'
      - name: Verify backup restoration and migration before staging swap
        run: |
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=8 root@38.242.233.166 \
            'bash -s -- staging 7955e72126e0b0596821dcc98efa3fb75117b6d1 ad64eb76600ca28b9312807f942630790e5d9d2e32ed1f86d75763e5c1e9d4f7' < ops/publish-release.sh
      - name: Read nonsecret publication receipt
        run: |
          ssh -o BatchMode=yes root@38.242.233.166 'cat /var/backups/jeeta-release/promotions/7955e72126e0b0596821dcc98efa3fb75117b6d1.staging.json' > staging-receipt.json
          cat staging-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-staging-7955e721-receipt
          path: staging-receipt.json
          retention-days: 14
