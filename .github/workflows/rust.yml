name: Rust

on:
  push:
    branches: [main, "feat/**", "design/**"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, documentation and the dependency policy (deny.toml); no database.
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Every cargo command but fmt (which takes no such flag) runs `--locked`: Cargo.lock is used
      # as committed, and a manifest change that needs a new lock file fails instead of resolving.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19
      - run: cargo deny --locked check

  # Every test, including the ones that open throwaway databases. The service's `postgres` role is
  # a superuser; jt_testkit::TestDb only uses it to create and drop each test's own ordinary
  # (non-superuser, non-BYPASSRLS) role and database, so row-level security binds the tests.
  rust-test:
    needs: release-artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JEETA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Download the package-scoped candidate; never build it with workspace test features.
      - uses: actions/download-artifact@v4
        with:
          name: jeeta-release-${{ github.sha }}
          path: release-candidate
      - run: tar -xf ../release-candidate/jeeta-release.tar -C "$RUNNER_TEMP"
      - run: cargo test --locked --workspace
        env:
          JEETA_RELEASE_BINARY: ${{ runner.temp }}/jeeta-release/jeeta
          JEETA_RELEASE_PANEL_DIR: ${{ runner.temp }}/jeeta-release/panel
      - name: Synthetic productisation smoke (no external provider traffic)
        run: make smoke-productisation
      # A whole-workspace run unifies the dev-only `test-loopback` feature into jt_outbound, so the
      # production-build egress test is compiled separately, without dev features.
      - run: cargo test --locked -p jt_outbound --test production_build

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/panel
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rust/panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  restore-drill:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Official PGDG repository; pin the major for both server and client.
      - name: Install PostgreSQL 16 host tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16 libseccomp2 python3
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Rust restore contracts with disposable PostgreSQL
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/restore-contracts-XXXXXXXX")
          trap 'pg_ctl -D "$work/db" -m immediate -w stop >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          mkdir "$work/socket"
          initdb -D "$work/db" -A trust --no-locale >/dev/null
          pg_ctl -D "$work/db" -o "-c listen_addresses='' -k $work/socket" -l "$work/postgres.log" -w start >/dev/null
          export JEETA_TEST_DATABASE_URL="postgresql://$(id -un)@localhost/postgres?host=$work/socket"
          cargo test --locked -p jt_pg --test m4_restore
      - name: Host-tools logical and PITR drill with no egress
        env:
          JEETA_REQUIRE_HOST_TOOLS: yes
        run: |
          set -euo pipefail
          umask 077
          private_log=$(mktemp "$RUNNER_TEMP/restore-drill-XXXXXXXX")
          trap 'rm -f "$private_log"' EXIT
          if ! bash scripts/tests/backup-restore.sh > "$private_log" 2>&1; then
            echo 'restore-drill failed; no private diagnostics uploaded'
            exit 1
          fi
          grep '^PASS [a-z_]*$' "$private_log" > restore-drill-report.txt
          test "$(wc -l < restore-drill-report.txt)" -eq 9
          cat restore-drill-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: rust/restore-drill-report.txt
          if-no-files-found: error
          retention-days: 30

  # The device bridge on Windows, the owner's PC that phones are plugged into (plan D2-T3): its
  # tests and its release build, uploaded as the program to install. It names no server crate, so
  # it builds without a database; the Linux jobs above build and lint it with the workspace.
  device-bridge-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked -p jeeta-device-bridge -p jt_devices -p jt_device_protocol
      - run: cargo build --locked --release -p jeeta-device-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-device-bridge-windows-${{ github.sha }}
          path: rust/target/release/jeeta-device-bridge.exe
          if-no-files-found: error
          retention-days: 14

  # Build and assemble only. No registry publication, deployment, or secret inputs.
  release-artifact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-production
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rust/panel/pnpm-lock.yaml
      - name: Verify packaging boundaries
        run: python3 -m unittest discover -s scripts -p 'test_package_release.py'
      # The packager owns the controlled production/panel builds and checks Cargo features.
      - name: Build and assemble verified candidate
        run: |
          set -euo pipefail
          python3 scripts/package-release.py "$RUNNER_TEMP/jeeta-release"
          tar -cf "$RUNNER_TEMP/jeeta-release.tar" -C "$RUNNER_TEMP" jeeta-release
      # Tar preserves the executable bits that upload-artifact alone does not preserve.
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-release-${{ github.sha }}
          path: ${{ runner.temp }}/jeeta-release.tar
          if-no-files-found: error
          retention-days: 14

  # The voice bridge's Python speech services and Asterisk configs: unit tests without the models
  # (plan V1-T3 B1-B3, D3). The model-backed tests run on the host inside the images.
  voice-speech:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/bridge/voice
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2 numpy==2.5.4 websockets==17.3
      - run: python -I -m pytest -c speech/pytest.ini -m "not models" -p no:cacheprovider asterisk speech

  # The voice bridge's Linux binary, for the host beside jeeta.service (plan V1-T3 D3). Build only:
  # no deployment, no secret inputs.
  voice-bridge-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: voice-bridge
      - run: cargo build --locked --release -p jeeta-voice-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-voice-bridge-linux-${{ github.sha }}
          path: rust/target/release/jeeta-voice-bridge
          if-no-files-found: error
          retention-days: 14
