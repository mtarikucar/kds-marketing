name: Rust

# Every change reaches the integration branch through a pull request, which runs this whole
# workflow; pushes run it again on main and design/** only, where the deploy artifacts come from.
on:
  push:
    branches: [main, "design/**"]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels that pull request's older run; push and manual runs each
# get a group of their own, so they are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The one test that runs the packaged candidate (nextest filterset). rust-test runs every test but
  # these, rust-release-binary runs only these and fails if none match: one definition, so the two
  # jobs cannot drift apart.
  RELEASE_BINARY_TESTS: 'binary_id(jeeta::m4_deployment) & test(=production_build_refuses_test_loopback)'

# Caches (Swatinem/rust-cache). Every job restores, only pushes to main and design/** save
# (`save-if`), so a pull request starts from its base branch's cache and branches do not evict
# it. The key is kept stable: each Rust job uninstalls every toolchain but the pinned one first
# (rust-cache hashes all installed toolchains, and the image's own stable moves as runner images
# roll out), and `env-vars: ImageOS` keeps caches of different OS releases apart. GitHub lets a
# pull request read only its base branch's and the default branch's caches, so one whose base is
# another feature branch (a stacked pull request) finds none and builds cold while main has no
# copy of this workflow.

jobs:
  # Which side jobs a pull request needs. Each runs on a pull request only when a file it builds
  # or tests from changes; pushes and manual runs build everything. A failure here fails open:
  # every job that waits on it then runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.paths.outputs.release }}
      voice_bridge: ${{ steps.paths.outputs.voice_bridge }}
      voice_speech: ${{ steps.paths.outputs.voice_speech }}
      device_bridge: ${{ steps.paths.outputs.device_bridge }}
      production_worker: ${{ steps.paths.outputs.production_worker }}
    steps:
      # The merge commit and both its parents: HEAD^1 is the tip of the base branch it merges
      # into, so the diff is exactly what the pull request changes.
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          declare -A run=([release]=false [voice_bridge]=false [voice_speech]=false [device_bridge]=false [production_worker]=false)
          if [ "$EVENT" != pull_request ] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            for job in "${!run[@]}"; do run[$job]=true; done
          else
            # --no-renames lists a moved file under its old path too, so moving a file out of a
            # job's directory still runs that job; core.quotePath=false keeps non-ASCII paths raw.
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
            echo "Changed files:"; cat "$RUNNER_TEMP/changed"
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/rust.yml) for job in "${!run[@]}"; do run[$job]=true; done ;;
              esac
              # The release package and its build: the whole Rust tree (package-release.py checks
              # every file under rust/, the bridges included, before it builds), the operations docs
              # it ships, Cargo configuration.
              case "$path" in
                rust/*|docs/operations/*|.cargo/*) run[release]=true ;;
              esac
              # Workspace build inputs and the domain crates the bridges link; the speech tests
              # also read jt_calls' phrase sources (test_speak_image.py).
              case "$path" in
                rust/Cargo.toml|rust/Cargo.lock|rust/rust-toolchain.toml|rust/.cargo/*|.cargo/*)
                  run[voice_bridge]=true; run[device_bridge]=true ;;
                rust/crates/domain/*)
                  run[voice_bridge]=true; run[device_bridge]=true; run[voice_speech]=true ;;
              esac
              case "$path" in
                rust/bridge/voice/*) run[voice_bridge]=true; run[voice_speech]=true ;;
                rust/bridge/device/*) run[device_bridge]=true ;;
                rust/scripts/production-worker/*) run[production_worker]=true ;;
              esac
            done < "$RUNNER_TEMP/changed"
          fi
          for job in "${!run[@]}"; do echo "$job=${run[$job]}" | tee -a "$GITHUB_OUTPUT"; done

  # Formatting, lints, documentation and the dependency policy (deny.toml); no database.
  rust-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          env-vars: ImageOS
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      # Every cargo command but fmt (which takes no such flag) runs `--locked`: Cargo.lock is used
      # as committed, and a manifest change that needs a new lock file fails instead of resolving.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19
      - run: cargo deny --locked check

  # Every test but the one that runs the packaged candidate (rust-release-binary), including the
  # ones that open throwaway databases. The service's `postgres` role is a superuser;
  # jt_testkit::TestDb only uses it to create and drop each test's own ordinary (non-superuser,
  # non-BYPASSRLS) role and database, so row-level security binds the tests. nextest runs each
  # test in a process of its own, all binaries at once. The tests keep a 4-CPU runner busy for
  # about ten minutes, so three runners each build the same test tree and run a third of them
  # (`--partition count`: every third test, so every test runs exactly once).
  rust-test:
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JEETA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Test builds link with mold, and third-party crates carry no debug info (the workspace's
      # own crates keep `line-tables-only`, so backtraces still show file:line). rust-cache hashes
      # CI_CARGO_CONFIG (`env-vars`), so changing it starts a new cache.
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CI_CARGO_CONFIG: |
        [profile.dev.package."*"]
        debug = false
        [profile.test.package."*"]
        debug = false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - name: CI build profile
        run: printf '%s\n' "$CI_CARGO_CONFIG" >> "$CARGO_HOME/config.toml"
      # Shared by the three partitions and rust-release-binary, which build the same test tree.
      # Partition 2 saves it: partition 1 runs the most tests and partition 3 the extra steps.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust-test
          env-vars: ImageOS CI_CARGO_CONFIG
          save-if: ${{ matrix.partition == 2 && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - id: nextest
        name: cargo nextest run --locked --workspace --no-fail-fast
        run: >-
          cargo nextest run --locked --workspace --no-fail-fast
          --partition count:${{ matrix.partition }}/3
          -E "not ($RELEASE_BINARY_TESTS)"
      # Partition 3 gets the fewest tests (`count` gives each binary's remainder to 1 and 2), so it
      # also runs these two. nextest does not run documentation tests; `cargo test` ran them with
      # the rest, so they run whether or not a test above failed.
      - name: cargo test --locked --workspace --doc
        if: ${{ matrix.partition == 3 && !cancelled() && steps.nextest.outcome != 'skipped' }}
        run: cargo test --locked --workspace --doc
      - name: Synthetic productisation smoke (no external provider traffic)
        if: matrix.partition == 3
        run: make smoke-productisation

  # A whole-workspace build unifies the dev-only `test-loopback` feature into jt_outbound, so the
  # production-build egress test is compiled separately, without dev features. No database.
  rust-production-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CI_CARGO_CONFIG: |
        [profile.dev.package."*"]
        debug = false
        [profile.test.package."*"]
        debug = false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - name: CI build profile
        run: printf '%s\n' "$CI_CARGO_CONFIG" >> "$CARGO_HOME/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          env-vars: ImageOS CI_CARGO_CONFIG
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      - run: cargo test --locked -p jt_outbound --test production_build

  # The one test that runs the packaged candidate ($RELEASE_BINARY_TESTS: bin/jeeta/tests/
  # m4_deployment.rs `production_build_refuses_test_loopback`, which reads JEETA_RELEASE_BINARY and
  # JEETA_RELEASE_PANEL_DIR). It waits for release-artifact and runs whenever that job does;
  # rust-test runs every other test without waiting. `--workspace` keeps the workspace's test
  # features, so this is the binary `cargo test --workspace` built. `--no-tests=fail`: a filter
  # that stops matching fails here instead of passing with no test run.
  rust-release-binary:
    needs: [changes, release-artifact]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JEETA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CI_CARGO_CONFIG: |
        [profile.dev.package."*"]
        debug = false
        [profile.test.package."*"]
        debug = false
    steps:
      # Never pass for want of a candidate: if release-artifact did not succeed, neither does this.
      - name: Require the release candidate
        if: needs.release-artifact.result != 'success'
        working-directory: .
        run: |
          echo "::error::release-artifact ended '${{ needs.release-artifact.result }}', so the candidate cannot be tested"
          exit 1
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        with:
          make-default: false
      - name: CI build profile
        run: printf '%s\n' "$CI_CARGO_CONFIG" >> "$CARGO_HOME/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust-test
          env-vars: ImageOS CI_CARGO_CONFIG
          save-if: false
      # Download the package-scoped candidate; never build it with workspace test features.
      - uses: actions/download-artifact@v4
        with:
          name: jeeta-release-${{ github.sha }}
          path: release-candidate
      - run: tar -xf ../release-candidate/jeeta-release.tar -C "$RUNNER_TEMP"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9
      - run: cargo nextest run --locked --workspace --test m4_deployment --no-tests=fail -E "$RELEASE_BINARY_TESTS"
        env:
          JEETA_RELEASE_BINARY: ${{ runner.temp }}/jeeta-release/jeeta
          JEETA_RELEASE_PANEL_DIR: ${{ runner.temp }}/jeeta-release/panel

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/panel
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rust/panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  production-worker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.production_worker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r rust/scripts/production-worker/requirements.txt
      - name: Media worker contracts (no model or provider calls)
        run: python -m unittest discover -s rust/scripts/production-worker -p 'test_*.py' -v

  restore-drill:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          env-vars: ImageOS
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      # Official PGDG repository; pin the major for both server and client.
      - name: Install PostgreSQL 16 host tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16 libseccomp2 python3
          echo '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
      - name: Rust restore contracts with disposable PostgreSQL
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/restore-contracts-XXXXXXXX")
          trap 'pg_ctl -D "$work/db" -m immediate -w stop >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          mkdir "$work/socket"
          initdb -D "$work/db" -A trust --no-locale >/dev/null
          pg_ctl -D "$work/db" -o "-c listen_addresses='' -k $work/socket" -l "$work/postgres.log" -w start >/dev/null
          export JEETA_TEST_DATABASE_URL="postgresql://$(id -un)@localhost/postgres?host=$work/socket"
          cargo test --locked -p jt_pg --test m4_restore
      - name: WAL retention contracts (synthetic archive, real pg_archivecleanup)
        env:
          JEETA_REQUIRE_HOST_TOOLS: yes
        run: bash scripts/tests/wal-retention.sh
      - name: Host-tools logical and PITR drill with no egress
        env:
          JEETA_REQUIRE_HOST_TOOLS: yes
        run: |
          set -euo pipefail
          umask 077
          private_log=$(mktemp "$RUNNER_TEMP/restore-drill-XXXXXXXX")
          trap 'rm -f "$private_log"' EXIT
          if ! bash scripts/tests/backup-restore.sh > "$private_log" 2>&1; then
            echo 'restore-drill failed; no private diagnostics uploaded'
            exit 1
          fi
          grep '^PASS [a-z_]*$' "$private_log" > restore-drill-report.txt
          test "$(wc -l < restore-drill-report.txt)" -eq 10
          cat restore-drill-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: rust/restore-drill-report.txt
          if-no-files-found: error
          retention-days: 30

  # The device bridge on Windows, the owner's PC that phones are plugged into (plan D2-T3): its
  # tests and its release build, uploaded as the program to install. It names no server crate, so
  # it builds without a database; the Linux jobs above build and lint it with the workspace.
  device-bridge-windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.device_bridge == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          env-vars: ImageOS
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      - run: cargo test --locked -p jeeta-device-bridge -p jt_devices -p jt_device_protocol
      - run: cargo build --locked --release -p jeeta-device-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-device-bridge-windows-${{ github.sha }}
          path: rust/target/release/jeeta-device-bridge.exe
          if-no-files-found: error
          retention-days: 14

  # Build and assemble only. No registry publication, deployment, or secret inputs.
  release-artifact:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release-production
          env-vars: ImageOS
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: rust/panel/pnpm-lock.yaml
      - name: Verify packaging boundaries
        run: python3 -m unittest discover -s scripts -p 'test_package_release.py'
      # The packager owns the controlled production/panel builds and checks Cargo features.
      - name: Build and assemble verified candidate
        run: |
          set -euo pipefail
          python3 scripts/package-release.py "$RUNNER_TEMP/jeeta-release"
          tar -cf "$RUNNER_TEMP/jeeta-release.tar" -C "$RUNNER_TEMP" jeeta-release
      # Tar preserves the executable bits that upload-artifact alone does not preserve.
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-release-${{ github.sha }}
          path: ${{ runner.temp }}/jeeta-release.tar
          if-no-files-found: error
          retention-days: 14

  # The voice bridge's Python speech services and Asterisk configs: unit tests without the models
  # (plan V1-T3 B1-B3, D3). The model-backed tests run on the host inside the images. Besides
  # rust/bridge/voice they read rust/crates/domain/jt_calls/src (the approved phrases); `changes`
  # runs this job for both, so widen it there if they read more.
  voice-speech:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.voice_speech == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/bridge/voice
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==8.4.2 numpy==2.5.4 websockets==17.3
      - run: python -I -m pytest -c speech/pytest.ini -m "not models" -p no:cacheprovider asterisk speech

  # The voice bridge's Linux binary, for the host beside jeeta.service (plan V1-T3 D3). Build only:
  # no deployment, no secret inputs.
  voice-bridge-linux:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.voice_bridge == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Keep only the pinned toolchain
        shell: bash
        run: |
          pinned=$(rustup default | cut -d' ' -f1)
          test -n "$pinned"
          for toolchain in $(rustup toolchain list --quiet | tr -d '\r'); do
            [ "$toolchain" = "$pinned" ] || rustup toolchain uninstall "$toolchain"
          done
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: voice-bridge
          env-vars: ImageOS
          save-if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/design/')) }}
      - run: cargo build --locked --release -p jeeta-voice-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: jeeta-voice-bridge-linux-${{ github.sha }}
          path: rust/target/release/jeeta-voice-bridge
          if-no-files-found: error
          retention-days: 14
