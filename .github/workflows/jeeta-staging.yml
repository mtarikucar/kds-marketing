name: Jeeta staging operation

# Dedicated operational branch for the explicitly requested staging publication.
# This first phase only inspects access and release paths; it does not deploy.
on:
  push:
    branches: [ops/staging-01194c85]
    paths: [.github/workflows/jeeta-staging.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: jeeta-staging-operation
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'mtarikucar/kds-marketing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check deployment credential bindings
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo '::error::SSH_PRIVATE_KEY_BASE64 is unavailable'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo '::error::SSH_KNOWN_HOSTS is unavailable'; exit 1; }
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          server-host: '38.242.233.166'
      - name: Inspect staging release paths without changing services
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 root@38.242.233.166 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active jeeta-staging.service
          test -x /root/staging-upgrade.sh
          sha256sum /root/staging-upgrade.sh
          for release in /opt/jeeta-staging/current /opt/jeeta/current; do
            if test -d "$release"; then
              readlink -f "$release"
              if test -f "$release/REVISION"; then cat "$release/REVISION"; fi
            fi
          done
          systemctl show jeeta-staging.service -p FragmentPath -p WorkingDirectory
          echo 'Staging upgrade source (credential-related lines omitted)'
          sed -E '/(PASSWORD|SECRET|TOKEN|PRIVATE_KEY|postgres(ql)?:\/\/)/I c\# credential-related line omitted' /root/staging-upgrade.sh
          curl --fail --silent --show-error http://127.0.0.1:8091/readyz
          REMOTE
