name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The backend gate used to be ONE serial job of ~68 min, almost all of it the
  # unit suite under ts-jest. Two changes fixed that:
  #
  #  1. jest now transpiles with @swc/jest instead of ts-jest. ts-jest was
  #     already running with `diagnostics: false` (transpile-only), so NO type
  #     checking was lost — `tsc --noEmit` in backend-checks is, and always was,
  #     the only type gate. Measured locally: full unit suite 55 min -> 83 s.
  #  2. the job was split in three, so wall-clock is the slowest leg instead of
  #     the sum of all of them.
  #
  # Sharding the unit suite was tried and deliberately dropped: at ~83 s the
  # per-shard `npm ci` + `prisma generate` setup costs more than the split saves.
  # If the suite ever grows back past ~10 min, add
  # `strategy: matrix: shard: [1,2,3,4]` + `npm test -- --shard=${{ matrix.shard }}/4`.
  #
  #   backend-checks  — migration parity, tsc (the type gate), build
  #   backend-unit    — the unit suite
  #   backend-e2e     — boots the real app, must stay in-band
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations ↔ schema parity
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=shadow -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:ci@localhost:5432/shadow \
            --exit-code
      # The ONLY type gate: jest transpiles with @swc/jest (no type checking),
      # exactly as ts-jest did before with `diagnostics: false`.
      - run: npx tsc --noEmit
      - run: npm run build

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Boots the real app with a mocked Prisma seam, so it needs no database.
      # Stays --runInBand: the suites share process-level app state.
      - run: npm run test:e2e

  # Opt-in real-database lane: provisions Postgres + Redis service containers and
  # runs the lead-lifecycle flow (ingest → assign → convert → commission) plus the
  # Redis throttler-store integration spec against the real thing. Kept separate
  # from the fast mocked lane so a DB hiccup never blocks the core gate.
  backend-realdb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketing:marketing@localhost:5432/marketing?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # E2E_REAL_DB=1 turns on the real-DB harness — NINE suites now, not just
      # lead-lifecycle: tariff resolution, research/conversation/media spend
      # settlement, the AI reply pre-flight, knowledge search, conversation list
      # and the digest's waiting-reply count. They exist because the unit tests
      # mock `PrismaService`, and a mock accepts any `where` you hand it — so a
      # query Prisma would REJECT at runtime passes every mocked spec. That is
      # not hypothetical: `workspaceId: { in: [id, null] }` threw on every call
      # for eight weeks with a green suite the whole time.
      #
      # --runInBand matters: each suite boots a full Nest app against the same
      # database, and in parallel they contend on boot-time services.
      #
      # The unflagged `backend-e2e` job runs the same config with the real-DB
      # suites SKIPPED (40 of them), which is what keeps that job fast.
      - run: npm run test:e2e:realdb

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # build = tsc && vite build (the type check is part of the build)
      - run: npm run build

  # Browser E2E. Runs the REAL API against a throwaway database and drives the
  # built frontend with Playwright — the only lane that exercises the request
  # path end to end (validation pipe, guards, entitlements, navigation). It
  # earned its keep immediately: the free-shape-array DTO bug that made
  # automations unsaveable was invisible to all 5400 unit tests, because those
  # call services directly and skip the pipe.
  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketing
          POSTGRES_PASSWORD: marketing
          POSTGRES_DB: marketing_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketing"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marketing:marketing@localhost:5432/marketing_e2e?schema=public
      PORT: '3101'
      NODE_ENV: development
      # Throwaway secrets: >=32 chars and distinct from one another, which is
      # what MarketingModule's JwtModule factory enforces.
      MARKETING_JWT_SECRET: ci-e2e-marketing-access-secret-000000000000
      MARKETING_JWT_REFRESH_SECRET: ci-e2e-marketing-refresh-secret-111111111111
      PLATFORM_JWT_SECRET: ci-e2e-platform-secret-2222222222222222222222
      INTERNAL_SERVICE_TOKEN: ci-e2e-internal-token-3333333333333333333333
      CORE_SERVICE_URL: http://localhost:9/unused
      PUBLIC_BASE_URL: http://localhost:3101
      APP_URL: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      # Safety rails, same as ops/e2e/up.mjs: no mail, no charges, no LLM spend.
      EMAIL_HOST: ''
      PAYTR_TEST_MODE: '1'
      AI_DISABLED: '1'
      # 300/60s is sized for one human; ~40 browser tests each fanning out to a
      # dozen endpoints blow through it, and the 429s look like broken auth.
      THROTTLE_GLOBAL_LIMIT: '20000'
      # The suite provisions a FRESH WORKSPACE PER TEST from one shared
      # identity (see e2e/global-setup.ts), which is exactly the shape the
      # production cap of 5 exists to stop. Same reasoning as the throttle
      # above: the harness is not a customer.
      MAX_OWNED_WORKSPACES_PER_USER: '100000'
      E2E_API_URL: http://localhost:3101/api
      E2E_APP_URL: http://localhost:5173
      VITE_API_URL: http://localhost:3101/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend deps + schema
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          # Without this a fresh database has no TRIAL row, createTrialSubscription
          # returns silently, and every workspace computes to zero entitlements —
          # which reads as "every gated route 403s", not as a missing seed.
          npm run seed:packages

      - name: Build the API
        working-directory: backend
        run: npm run build

      - name: Start the API
        working-directory: backend
        # The compiled build, not `start:dev` — watch mode is slower to boot and
        # is not what ships.
        run: |
          npm run start:prod > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3101/api/health >/dev/null && exit 0
            sleep 3
          done
          echo "API failed to become healthy"; tail -100 /tmp/api.log; exit 1

      - name: Frontend deps + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check the E2E suite
        working-directory: frontend
        # tsconfig only includes src, and Playwright transpiles WITHOUT
        # type-checking — so nothing else would catch a broken type in e2e/.
        run: npm run typecheck:e2e

      - run: npm run e2e
        working-directory: frontend

      - name: API log on failure
        if: failure()
        run: tail -200 /tmp/api.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
