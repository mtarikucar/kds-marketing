name: Jeeta operator SSH access (one-time)
on:
  push:
    branches: [ops/cutover-jeetagrowth]
    paths: [.github/workflows/jeeta-ops-access.yml]
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-ssh
        with:
          ssh-private-key-base64: ${{ secrets.SSH_PRIVATE_KEY_BASE64 }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          server-host: '38.242.233.166'
      - name: Add the operator's public key (idempotent)
        run: |
          ssh -o BatchMode=yes root@38.242.233.166 'K="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN3wshK8cN5pOs+OVNCpEi4CNvdMTiELuh5nn/JeZhXl claude-jeeta-ops"; mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && (grep -qxF "$K" ~/.ssh/authorized_keys || echo "$K" >> ~/.ssh/authorized_keys) && echo key-present'
